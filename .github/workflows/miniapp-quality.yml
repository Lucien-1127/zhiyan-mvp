name: Mini App quality

on:
  pull_request:
    branches: [main, master, fix/confine-miniapp-paths]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: miniapp-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Mini App lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mini-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mini-app/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

