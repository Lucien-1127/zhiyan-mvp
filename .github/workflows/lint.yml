name: "程式碼品質檢查"

on:
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Python 語法檢查
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: 安裝 Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: 語法檢查
      run: |
        python - <<'PY'
        import py_compile
        import subprocess

        paths = subprocess.check_output(["git", "ls-files", "-z", "--", "*.py"]).decode().split("\0")
        for path in filter(None, paths):
            py_compile.compile(path, doraise=True)
        print("Python syntax checks passed")
        PY

    - name: 安裝後端測試相依套件
      run: python -m pip install -r mini-app/backend/requirements.txt

    - name: 路徑安全回歸測試
      run: python -m unittest discover -s mini-app/backend/tests -p 'test_*.py' -v
